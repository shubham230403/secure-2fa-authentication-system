<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Setup 2FA</title>
</head>

<body>

    <h1>Set Up Two-Factor Authentication</h1>

    <p>Account: {{ username }}</p>

    <h3>Step 1</h3>

    <p>
        Open Google Authenticator or Microsoft Authenticator
        on your phone.
    </p>

    <h3>Step 2</h3>

    <p>Scan this QR code:</p>

    <img
        src="{{ url_for('static', filename=qr_code) }}"
        alt="2FA QR Code"
        width="250"
    >

    <h3>Step 3</h3>

    <p>Enter the 6-digit code generated by your authenticator app.</p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
       <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="text"
            name="otp"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="Enter 6-digit code"
            required
        >

        <br><br>

        <button type="submit">
            Enable 2FA
        </button>

    </form>

</body>

</html>
